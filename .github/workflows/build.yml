name: Build desktop apps

# Builds Audio Repair for Windows and Mac on GitHub's own machines:
#   Windows  "Audio Repair - Windows Installer.exe"
#   Mac      "Audio Repair - Mac Installer.dmg"  (Apple silicon; drag to Applications)
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also attach the files to a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  APP_VERSION: "1.1.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # PyTorch 2.1 (needed by DeepFilterNet 0.5.6) supports up to 3.11

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          echo "numpy<2" > constraints.txt
          python -m pip install -c constraints.txt torch==2.1.2 torchaudio==2.1.2
          python -m pip install -c constraints.txt fastapi uvicorn python-multipart numpy scipy soundfile pyloudnorm av pyinstaller pillow
          python -m pip install -c constraints.txt deepfilternet
          # Resemble Enhance: inference only, without its training extras (deepspeed, gradio)
          python -m pip install -c constraints.txt --no-deps resemble-enhance
          python -m pip install -c constraints.txt celluloid librosa matplotlib omegaconf pandas ptflops resampy rich tabulate tqdm
          python -m pip install --no-deps pyrnnoise || echo "pyrnnoise unavailable on this platform, using the built-in denoiser"

      - name: Fetch AI model weights
        shell: bash
        run: |
          mkdir -p models/enhancer_stage2/ds/G/default
          # DeepFilterNet3: let DeepFilterNet fetch its own official model, then copy it out of its cache
          python -c "from df.enhance import init_df; init_df(log_level='ERROR')"
          CACHE=$(python -c "import appdirs, os; print(os.path.join(appdirs.user_cache_dir('DeepFilterNet'), 'DeepFilterNet3'))")
          cp -R "$CACHE" models/DeepFilterNet3
          # Studio voice: Resemble Enhance weights from the official Hugging Face repository (MIT)
          HF=https://huggingface.co/ResembleAI/resemble-enhance/resolve/main/enhancer_stage2
          curl -sSfL "$HF/hparams.yaml" -o models/enhancer_stage2/hparams.yaml
          curl -sSfL "$HF/ds/G/default/mp_rank_00_model_states.pt" -o models/enhancer_stage2/ds/G/default/mp_rank_00_model_states.pt
          # The settings file was written on Linux and holds paths Windows cannot read (see the script)
          python tools/clean_hparams.py models/enhancer_stage2/hparams.yaml
          # fail the build here, not on a user's computer, if Studio voice cannot read its own settings
          python -c "from pathlib import Path; from resemble_enhance.enhancer.hparams import HParams; h = HParams.load(Path('models/enhancer_stage2')); print('Studio settings load OK, wav_rate', h.wav_rate)"
          python - <<'PY'
          import hashlib, pathlib, sys
          f = pathlib.Path("models/enhancer_stage2/ds/G/default/mp_rank_00_model_states.pt")
          h = hashlib.sha256(f.read_bytes()).hexdigest()
          print(f, f.stat().st_size, h)
          sys.exit(0 if h == "f9d035f318de3e6d919bc70cf7ad7d32b4fe92ec5cbe0b30029a27f5db07d9d6" else "Studio weights do not match the tested file")
          PY
          ls -R models | head -20
          echo "AUDIO_REPAIR_MODELS=$PWD/models" >> "$GITHUB_ENV"

      - name: Native window library
        run: python -m pip install pywebview

      - name: Build
        shell: bash
        run: python build.py

      # ---------------------------------------------------------------- Windows: installer
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "Audio Repair - Windows Installer.exe"

      # ---------------------------------------------------------------- Mac: drag-to-Applications dmg
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R "dist/Audio Repair.app" dmg/
          ln -s /Applications dmg/Applications
          cp HANDOFF.md dmg/             # how the app is made; the app keeps its own copy up to date
          hdiutil create -volname "Audio Repair" -srcfolder dmg -ov -format UDZO "Audio Repair - Mac Installer.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Audio Repair - ${{ matrix.name }}
          path: |
            Audio Repair - Windows Installer.exe
            Audio Repair - Mac Installer.dmg
            HANDOFF.md
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Audio Repair - Windows Installer.exe
            Audio Repair - Mac Installer.dmg
            HANDOFF.md
