name: Build desktop apps

# Builds Audio Repair for Windows, macOS and Linux on GitHub's own machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0 to also attach the files to a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn python-multipart numpy scipy soundfile pyloudnorm av pyinstaller
          python -m pip install --no-deps pyrnnoise || echo "pyrnnoise unavailable on this platform, using the built-in denoiser"

      - name: Native window library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install "pywebview[qt]"
          else
            python -m pip install pywebview
          fi

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y python3-tk libfuse2 libsndfile1
          libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgl1 libegl1 libxkbcommon-x11-0
          libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-xinerama0

      - name: Build
        shell: bash
        run: python build.py

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Audio Repair" -DestinationPath Audio-Repair-Windows.zip

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Audio Repair" -srcfolder "dist/Audio Repair.app" -ov -format UDZO Audio-Repair-macOS.dmg

      - name: Package (Linux tar.gz and AppImage)
        if: runner.os == 'Linux'
        run: |
          tar -czf Audio-Repair-Linux.tar.gz -C dist "Audio Repair"
          mkdir -p AppDir/usr/bin
          cp -r "dist/Audio Repair/." AppDir/usr/bin/
          cp assets/icon.png AppDir/audio-repair.png
          cat > AppDir/audio-repair.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Audio Repair
          Exec=AppRun
          Icon=audio-repair
          Categories=AudioVideo;Audio;
          EOF
          sed -i 's/^          //' AppDir/audio-repair.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Audio Repair" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Audio-Repair-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Repair-${{ matrix.name }}
          path: |
            Audio-Repair-Windows.zip
            Audio-Repair-macOS.dmg
            Audio-Repair-Linux.tar.gz
            Audio-Repair-Linux-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Audio-Repair-Windows.zip
            Audio-Repair-macOS.dmg
            Audio-Repair-Linux.tar.gz
            Audio-Repair-Linux-x86_64.AppImage
