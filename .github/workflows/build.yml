name: Build desktop apps

# Builds Audio Repair for Windows, macOS and Linux on GitHub's own machines:
#   Windows  Audio-Repair-Setup-<v>-x64.exe (installer)  and  Audio-Repair-Portable-<v>-x64.exe (no install)
#   macOS    Audio-Repair-<v>-mac-arm64.dmg (drag to Applications)
#   Linux    Audio-Repair-<v>-linux-x86_64.AppImage  and  Audio-Repair-<v>-linux-x86_64.tar.gz
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also attach the files to a Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  APP_VERSION: "1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn python-multipart numpy scipy soundfile pyloudnorm av pyinstaller pillow
          python -m pip install --no-deps pyrnnoise || echo "pyrnnoise unavailable on this platform, using the built-in denoiser"

      - name: Native window library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install "pywebview[qt]"
          else
            python -m pip install pywebview
          fi

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y python3-tk libfuse2 libsndfile1
          libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgl1 libegl1 libxkbcommon-x11-0
          libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-xinerama0

      - name: Build
        shell: bash
        run: python build.py

      # ---------------------------------------------------------------- Windows: installer + portable exe
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Audio-Repair-Setup-*.exe

      - name: Package (Windows portable)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          AUDIO_REPAIR_ONEFILE=1 python build.py
          cp "dist/Audio Repair Portable.exe" "Audio-Repair-Portable-${APP_VERSION}-x64.exe"

      # ---------------------------------------------------------------- macOS: drag-to-Applications dmg
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg
          cp -R "dist/Audio Repair.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Audio Repair" -srcfolder dmg -ov -format UDZO "Audio-Repair-${APP_VERSION}-mac-arm64.dmg"

      # ---------------------------------------------------------------- Linux: AppImage + tar.gz
      - name: Package (Linux AppImage and tar.gz)
        if: runner.os == 'Linux'
        run: |
          tar -czf "Audio-Repair-${APP_VERSION}-linux-x86_64.tar.gz" -C dist "Audio Repair"
          mkdir -p AppDir/usr/bin
          cp -r "dist/Audio Repair/." AppDir/usr/bin/
          cp assets/icon.png AppDir/audio-repair.png
          printf '[Desktop Entry]\nType=Application\nName=Audio Repair\nExec=AppRun\nIcon=audio-repair\nCategories=AudioVideo;Audio;\n' > AppDir/audio-repair.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Audio Repair" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "Audio-Repair-${APP_VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Repair-${{ matrix.name }}
          path: |
            Audio-Repair-Setup-*.exe
            Audio-Repair-Portable-*.exe
            Audio-Repair-*-mac-*.dmg
            Audio-Repair-*-linux-*.AppImage
            Audio-Repair-*-linux-*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Audio-Repair-Setup-*.exe
            Audio-Repair-Portable-*.exe
            Audio-Repair-*-mac-*.dmg
            Audio-Repair-*-linux-*.AppImage
            Audio-Repair-*-linux-*.tar.gz
